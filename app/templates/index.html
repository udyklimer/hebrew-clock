<!DOCTYPE html>
<html lang="{{ ui_lang }}" dir="{{ t.dir }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t.login_title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; box-sizing: border-box; }
    .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 340px; max-width: 100%; box-sizing: border-box; }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    h2 { margin: 0; color: #1a1a1a; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; }
    input { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 0.75rem; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 0.5rem; }
    .btn-green { background: #28a745; }
    .error { background: #f8d7da; color: #842029; padding: 0.6rem; border-radius: 6px; margin-bottom: 1rem; text-align: center; }
    .lang-switch { display: flex; gap: 0.4rem; }
    .flag { display: block; width: 30px; height: 20px; border-radius: 3px; overflow: hidden; opacity: 0.45; outline: 1px solid #ddd; }
    .flag.current { opacity: 1; outline: 2px solid #007bff; }
    .flag svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <h2>{{ t.app_name }}</h2>
      {% include "_lang_switch.html" %}
    </div>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label for="login-username">{{ t.username }}</label>
        <input type="text" id="login-username" name="username" required autofocus />
      </div>
      <div class="form-group">
        <label for="login-password">{{ t.password }}</label>
        <input type="password" id="login-password" name="password" required />
      </div>
      <button type="submit">{{ t.login }}</button>
    </form>

    <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #eee;" />

    <form method="post" action="/register">
      <div class="form-group">
        <label for="register-username">{{ t.register_label }}</label>
        <input type="text" id="register-username" name="username" placeholder="{{ t.new_username }}" required />
      </div>
      <div class="form-group">
        <input type="password" name="password" placeholder="{{ t.new_password }}" required />
      </div>
      <button type="submit" class="btn-green">{{ t.register }}</button>
    </form>

    <p style="text-align: center; margin: 1.5rem 0 0; font-size: 0.85rem;">
      <a href="/install" style="color: #007bff; text-decoration: none;">{{ t.install_link }}</a>
    </p>
  </div>
</body>
</html>
