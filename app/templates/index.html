<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>שעון עברי - התחברות</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 340px; }
    h2 { margin-top: 0; text-align: center; color: #1a1a1a; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; }
    input { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 0.75rem; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 0.5rem; }
    .btn-green { background: #28a745; }
    .error { background: #f8d7da; color: #842029; padding: 0.6rem; border-radius: 6px; margin-bottom: 1rem; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>שעון עברי</h2>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label>שם משתמש:</label>
        <input type="text" name="username" required autofocus />
      </div>
      <div class="form-group">
        <label>סיסמה:</label>
        <input type="password" name="password" required />
      </div>
      <button type="submit">התחבר</button>
    </form>

    <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #eee;" />

    <form method="post" action="/register">
      <div class="form-group">
        <label>הרשמה לחדשים:</label>
        <input type="text" name="username" placeholder="שם משתמש חדש" required />
      </div>
      <div class="form-group">
        <input type="password" name="password" placeholder="סיסמה" required />
      </div>
      <button type="submit" class="btn-green">צור חשבון</button>
    </form>
  </div>
</body>
</html>
