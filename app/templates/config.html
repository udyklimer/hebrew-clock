<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הגדרות שעון - {{ username }}</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 380px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 0.8rem; border-bottom: 1px solid #eee; }
    .user-info { font-size: 0.95rem; color: #333; }
    .logout-btn { color: #dc3545; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .logout-btn:hover { text-decoration: underline; }
    h2 { margin-top: 0; color: #1a1a1a; font-size: 1.4rem; margin-bottom: 1.2rem; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; color: #444; }
    select, input[type="text"] { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
    select:focus, input:focus { border-color: #28a745; outline: none; }
    .btn-save { width: 100%; padding: 0.75rem; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; margin-top: 0.5rem; transition: background 0.2s; }
    .btn-save:hover { background: #218838; }
    .saved-msg { background: #d1e7dd; color: #0f5132; padding: 0.6rem; border-radius: 6px; text-align: center; font-size: 0.9rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <span class="user-info">שלום, <strong>{{ username }}</strong></span>
      <a href="/logout" class="logout-btn">התנתק</a>
    </div>

    <h2>הגדרות השעון שלי</h2>

    {% if saved %}
      <div class="saved-msg">✓ ההגדרות נשמרו בהצלחה!</div>
    {% endif %}

    <form method="post" action="/config">
      <div class="form-group">
        <label for="font">גופן (Font):</label>
        <select name="font" id="font">
          {% for f in fonts %}
            <option value="{{ f }}" {% if f == selected_font %}selected{% endif %}>{{ f }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="location">עיר (Location):</label>
        <input type="text" name="location" id="location" value="{{ selected_location }}" required />
      </div>

      <div class="form-group">
        <label for="calendar">לוח שנה (Calendar):</label>
        <select name="calendar" id="calendar">
          <option value="gregorian" {% if selected_calendar == 'gregorian' %}selected{% endif %}>לועזי</option>
          <option value="jewish" {% if selected_calendar == 'jewish' %}selected{% endif %}>עברי</option>
        </select>
      </div>

      <div class="form-group">
        <label for="sleeptime">מצב שינה (Sleep Mode):</label>
        <select name="sleeptime" id="sleeptime">
          <option value="0" {% if selected_sleeptime == '0' %}selected{% endif %}>כבוי (פועל רגיל)</option>
          <option value="1" {% if selected_sleeptime == '1' %}selected{% endif %}>מופעל</option>
        </select>
      </div>

      <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem;">
        <input type="checkbox" name="blank" id="blank" value="1" {% if selected_blank %}checked{% endif %} style="width: 18px; height: 18px; cursor: pointer;" />
        <label for="blank" style="margin-bottom: 0; cursor: pointer;">מסך ריק (כיבוי מסך)</label>
      </div>

      <button type="submit" class="btn-save">שמור הגדרות</button>
    </form>
  </div>
</body>
</html>
